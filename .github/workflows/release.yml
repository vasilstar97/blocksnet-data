name: Run City Scripts on Release

on:
  release:
    types: [created]

jobs:
  process-cities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Get release body
        id: release_info
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.release.tag_name
            });
            core.setOutput("body", release.data.body);

      - name: Parse city list from release body
        id: city_list
        run: |
          echo "${{ steps.release_info.outputs.body }}" > release_body.txt
          grep -E '^\s*-\s*' release_body.txt | sed 's/^- //' > city_list.txt || true
          cat city_list.txt
          echo "cities=$(paste -sd "," city_list.txt)" >> $GITHUB_OUTPUT

      - name: Create output directories
        run: mkdir -p outputs tmp_output

      - name: Run city scripts
        run: |
          IFS=',' read -ra CITIES <<< "${{ steps.city_list.outputs.cities }}"
          for city in "${CITIES[@]}"; do
            city_dir="cities/$city"
            output_dir="tmp_output/$city"
            mkdir -p "$output_dir"

            if [ -f "$city_dir/main.py" ]; then
              echo "⚙️ Running main.py for $city"
              cp "$city_dir/main.py" "$output_dir/"
              (
                cd "$output_dir"
                python main.py
              )
              exit_code=$?
              if [ $exit_code -eq 0 ]; then
                zip -r "outputs/${city}.zip" "$output_dir"
                echo "✅ $city completed"
              else
                echo "❌ $city failed (exit code $exit_code), skipping"
              fi
            else
              echo "⚠️ No main.py found for $city — skipping"
            fi
          done

      - name: Freeze Python environment
        run: pip freeze > outputs/pip_freeze.txt

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: outputs/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
