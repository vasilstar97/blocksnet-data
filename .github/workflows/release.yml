name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  process-cities:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Get previous tag
        id: prev_tag
        run: |
          tag=$(git tag --sort=-creatordate | grep -v "${{ github.ref_name }}" | head -n 1)
          echo "Previous tag: $tag"
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Get changed cities
        id: changed
        run: |
          git fetch --tags

          if [ -z "${{ steps.prev_tag.outputs.tag }}" ]; then
            echo "No previous tag found, using all cities"
            find cities -maxdepth 1 -mindepth 1 -type d -printf '%f\n' > changed.txt
          else
            git diff --name-only ${{ steps.prev_tag.outputs.tag }} HEAD > changed_files.txt
            grep -oE '^cities/[^/]+/' changed_files.txt | cut -d'/' -f2 | sort -u > changed.txt
          fi

          echo "Detected cities to process:"
          cat changed.txt || echo "(none)"
          echo "cities=$(paste -sd "," changed.txt)" >> $GITHUB_OUTPUT

      - name: Create output directories
        run: mkdir -p outputs tmp

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run city scripts
        run: |
          IFS=',' read -ra CITIES <<< "${{ steps.changed.outputs.cities }}"
          for city in "${CITIES[@]}"; do
            city_dir="cities/$city"
            output_dir="tmp/$city"
            mkdir -p "$output_dir"

            if [ -f "$city_dir/main.py" ]; then
              echo "⚙️ Running main.py for $city"
              (
                cd "$output_dir"
                python "../../$city_dir/main.py"
              )
              exit_code=$?
              if [ $exit_code -eq 0 ]; then
                (
                  cd "$output_dir"
                  zip -r "../../outputs/${city}.zip" ./* -x "cache/*" "*.tmp"
                )
                echo "✅ $city completed"
              else
                echo "❌ $city failed (exit code $exit_code), skipping"
              fi
            else
              echo "⚠️ No main.py found for $city — skipping"
            fi
          done

      - name: Freeze Python environment
        run: pip freeze > outputs/pip_freeze.txt

      - name: Generate release notes
        id: release_notes
        run: |
          echo "## Release: \`${{ github.event.release.tag_name }}\`" > release_notes.md
          echo "" >> release_notes.md

          echo "### Blocksnet Version" >> release_notes.md
          blocksnet_ver=$(python -c "import blocksnet; print(blocksnet.__version__)")
          echo '```bash' >> release_notes.md
          echo "pip install blocksnet==${blocksnet_ver}" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md

          echo "### Cities" >> release_notes.md
          for city_zip in outputs/*.zip; do
            city=$(basename "$city_zip" .zip)
            echo "- $city:" >> release_notes.md
            unzip -l "$city_zip" | tail -n +4 | head -n -2 | awk '{print "  - `" $4 "`"}' >> release_notes.md
          done

          echo "release_notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v1
        with:
          files: outputs/*
          body_path: ${{ steps.release_notes.outputs.release_notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

